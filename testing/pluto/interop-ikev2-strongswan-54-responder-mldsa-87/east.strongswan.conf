charon {
    threads = 16

    # ML-DSA AUTH payloads are large.
    max_packet = 12000

    plugins {
        ml { load = yes }
    }

    filelog {
       ignored_logname { path = /tmp/charon.log
	  time_format = %b %e %T
	  append = no
	  default = 4
       }
       stderr {
	  ike = 4
	  knl = 4
	  ike_name = yes
       }
    }
}

pluto {
}

libstrongswan {
}
